name: Update README

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python3 << 'PY'
          import os
          import re

          folders = []

          for name in os.listdir("."):
              if os.path.isdir(name) and name.startswith("Experiment"):
                  folders.append(name)

          folders.sort()

          lines = ["## 📂 Repository Contents", ""]

          if folders:
              for folder in folders:
                  display = folder.replace("-", " ")
                  lines.append(
                      f"* **{display}:** [{display}](./{folder})"
                  )
          else:
              lines.append("* No experiments added yet.")

          new_section = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"## 📂 Repository Contents.*?(?=\n## |\Z)"

          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(
                  pattern,
                  new_section,
                  readme,
                  flags=re.DOTALL
              )
          else:
              readme += "\n\n" + new_section + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Save README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "docs: update experiment list"
            git push
          fi
